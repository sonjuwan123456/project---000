name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새로 푸시하면 앞선 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json의 packageManager 값을 그대로 쓴다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 포맷·린트·타입 검사·테스트. 로컬에서 치는 pnpm check와 같은 명령이다.
      - run: pnpm check

      - run: pnpm build
